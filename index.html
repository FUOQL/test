<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白云山 · 数字导览</title>
<style>
  /* ========== DESIGN TOKENS ========== */
  :root {
    --color-entrance: #4a90d9;   /* 入口 */
    --color-temple:   #c8965c;   /* 寺庙 */
    --color-nature:   #e8739e;   /* 自然景观 */
    --color-summit:   #f0a030;   /* 山顶 */
    --color-park:     #5b9a5b;   /* 公园 */
    --color-water:    #4fc3f7;   /* 水域 */
    --color-view:     #ef8354;   /* 观景台 */
    --color-hiking:   #8b9d6b;   /* 步道 */

    --bg-root:        #1c2a1e;
    --surface-glass:  rgba(28, 42, 30, 0.78);
    --surface-hover:  rgba(40, 56, 42, 0.88);
    --text-primary:   #f2eee8;
    --text-secondary: #b8b2a6;
    --text-muted:     #8a8478;
    --border-subtle:  rgba(255,255,255,0.08);
    --border-active:  rgba(255,255,255,0.18);
    --shadow-sm:      0 2px 8px rgba(0,0,0,0.25);
    --shadow-md:      0 4px 20px rgba(0,0,0,0.35);
    --shadow-lg:      0 8px 40px rgba(0,0,0,0.50);
    --radius-sm:      8px;
    --radius-md:      14px;
    --radius-lg:      20px;
    --ease-out:       cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring:    cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg-root);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh; height: 100dvh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ========== TOP BAR — floating, minimal ========== */
  .topbar {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px 8px 18px;
    background: var(--surface-glass);
    backdrop-filter: blur(20px) saturate(120%);
    -webkit-backdrop-filter: blur(20px) saturate(120%);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    max-width: calc(100vw - 32px);
    flex-wrap: wrap;
  }
  .topbar .brand {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    white-space: nowrap;
    color: var(--text-primary);
  }
  .topbar .divider {
    width: 1px; height: 20px;
    background: var(--border-subtle);
    margin: 0 2px;
  }
  .topbar .spot-count {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 12px;
    border: 1px solid var(--border-subtle);
    border-radius: 20px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    transition: all 0.2s var(--ease-out);
    white-space: nowrap;
    user-select: none;
  }
  .btn:hover {
    background: rgba(255,255,255,0.08);
    color: var(--text-primary);
    border-color: var(--border-active);
  }
  .btn:focus-visible {
    outline: 2px solid var(--color-summit);
    outline-offset: 2px;
  }
  .btn.active {
    background: rgba(240,160,48,0.18);
    border-color: var(--color-summit);
    color: var(--color-summit);
    }

    /* ========== MAP CONTAINER ========== */  .map-wrap {
    flex: 1;
    position: relative;
    cursor: grab;
    user-select: none;
    overflow: hidden;
  }
  .map-wrap.dragging { cursor: grabbing; }

  .map-inner {
    position: absolute;
    transform-origin: 0 0;
    will-change: transform;
  }

  #scenic-map {
    display: block;
    width: 1358px;
    height: 1159px;
    pointer-events: none;
  }

  /* 艺术字标题 */
  .title-art {
    position: absolute;
    top: 16px;
    left: 20px;
    width: 260px;
    height: auto;
    pointer-events: none;
    z-index: 5;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    opacity: 0.92;
  }

  /* ========== MARKER PINS ========== */
  .marker {
    position: absolute;
    cursor: pointer;
    z-index: 10;
    pointer-events: auto;
    transform: translate(-50%, -100%);
    transition: transform 0.25s var(--ease-spring);
  }
  .marker:hover,
  .marker.active {
    z-index: 20;
    transform: translate(-50%, -100%) scale(1.22);
  }

  /* Pin shape: circle + triangle tail */
  .pin {
    position: relative;
    width: 32px;
    height: 36px;
  }
  .pin .head {
    width: 32px; height: 32px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2.5px solid rgba(255,255,255,0.85);
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    transition: all 0.2s var(--ease-out);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pin .head .num {
    transform: rotate(45deg);
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }

  /* Category colors */
  .cat-entrance .head { background: var(--color-entrance); }
  .cat-temple   .head { background: var(--color-temple); }
  .cat-nature   .head { background: var(--color-nature); }
  .cat-summit   .head { background: var(--color-summit); }
  .cat-park     .head { background: var(--color-park); }
  .cat-water    .head { background: var(--color-water); }
  .cat-view     .head { background: var(--color-view); }
  .cat-hiking   .head { background: var(--color-hiking); }

  .marker.active .head {
    border-color: #fff;
    box-shadow: 0 0 0 6px rgba(255,255,255,0.15), 0 6px 20px rgba(0,0,0,0.4);
  }

  /* Pulsing ring */
  .marker .pulse-ring {
    position: absolute;
    top: 10px; left: 10px;
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid;
    opacity: 0;
    pointer-events: none;
  }
  .marker.active .pulse-ring {
    animation: ring-pulse 1.8s ease-out infinite;
  }
  @keyframes ring-pulse {
    0%   { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(5); opacity: 0; }
  }

  /* Label below pin */
  .marker .label {
    position: absolute;
    bottom: 42px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    color: #fff;
    padding: 4px 12px;
    border-radius: 12px;
    border: none;
    pointer-events: none;
    opacity: 0.9;
    transition: opacity 0.15s, box-shadow 0.2s;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .cat-entrance .label { background: var(--color-entrance); }
  .cat-temple   .label { background: var(--color-temple); }
  .cat-nature   .label { background: var(--color-nature); }
  .cat-summit   .label { background: var(--color-summit); }
  .cat-park     .label { background: var(--color-park); }
  .cat-water    .label { background: var(--color-water); }
  .cat-view     .label { background: var(--color-view); }
  .cat-hiking   .label { background: var(--color-hiking); }
  .marker:hover .label,
  .marker.active .label { opacity: 1; }

  /* ========== INFO PANEL ========== */
  .panel-backdrop {
    position: fixed;
    inset: 0;
    z-index: 199;
    background: rgba(0,0,0,0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s var(--ease-out);
  }
  .panel-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .panel {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%) translateX(20px);
    width: 340px;
    max-height: min(520px, 76dvh);
    overflow-y: auto;
    background: var(--surface-glass);
    backdrop-filter: blur(24px) saturate(130%);
    -webkit-backdrop-filter: blur(24px) saturate(130%);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s var(--ease-spring);
    overscroll-behavior: contain;
  }
  .panel.open {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(-50%) translateX(0);
  }
  .panel::-webkit-scrollbar { width: 4px; }
  .panel::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
  }

  .panel-header {
    position: relative;
    padding: 20px 20px 12px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .panel-header .cat-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 2px 10px;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .cat-tag.entrance { background: rgba(74,144,217,0.2); color: var(--color-entrance); }
  .cat-tag.temple   { background: rgba(200,150,92,0.2); color: var(--color-temple); }
  .cat-tag.nature   { background: rgba(232,115,158,0.2); color: var(--color-nature); }
  .cat-tag.summit   { background: rgba(240,160,48,0.2); color: var(--color-summit); }
  .cat-tag.park     { background: rgba(91,154,91,0.2); color: var(--color-park); }
  .cat-tag.water    { background: rgba(79,195,247,0.2); color: var(--color-water); }
  .cat-tag.view     { background: rgba(239,131,84,0.2); color: var(--color-view); }
  .cat-tag.hiking   { background: rgba(139,157,107,0.2); color: var(--color-hiking); }

  .panel-header h3 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .panel-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.06);
    color: var(--text-secondary);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .panel-close:hover {
    background: rgba(255,255,255,0.15);
    color: var(--text-primary);
  }
  .panel-close:focus-visible {
    outline: 2px solid var(--color-summit);
    outline-offset: 2px;
  }

  .panel-body { padding: 16px 20px 20px; }
  .panel-body p {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-secondary);
  }
  .panel-body .quick-facts {
    display: flex;
    gap: 16px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border-subtle);
  }
  .quick-facts .fact {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .quick-facts .fact .fv { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .quick-facts .fact .fl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

  .panel-nav {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border-subtle);
  }
  .panel-nav button {
    flex: 1;
    padding: 8px 0;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }
  .panel-nav button:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text-primary);
    border-color: var(--border-active);
  }
  .panel-nav button:focus-visible {
    outline: 2px solid var(--color-summit);
    outline-offset: 2px;
  }

  /* ========== ZOOM CONTROLS ========== */
  .zoom-ctrl {
    position: fixed;
    left: 20px;
    bottom: 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 100;
  }
  .zoom-ctrl button {
    width: 40px; height: 40px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    background: var(--surface-glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--text-primary);
    font-size: 20px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .zoom-ctrl button:hover { background: var(--surface-hover); border-color: var(--border-active); }
  .zoom-ctrl button:focus-visible {
    outline: 2px solid var(--color-summit);
    outline-offset: 2px;
  }

  /* ========== CURRENT LOCATION (virtual GPS) ========== */
  .location-dot {
    position: absolute;
    z-index: 30;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: left 0.8s cubic-bezier(0.25, 0.1, 0.25, 1),
                top  0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
  }
  .location-dot .inner {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #3b82f6;
    border: 4px solid #fff;
    box-shadow: 0 0 0 6px rgba(59,130,246,0.25), 0 4px 16px rgba(59,130,246,0.5);
    animation: loc-bounce 1.6s ease-in-out infinite;
  }
  @keyframes loc-bounce {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.15); }
  }
  .location-dot .ripple {
    position: absolute;
    top: 50%; left: 50%;
    width: 24px; height: 24px;
    margin: -12px 0 0 -12px;
    border-radius: 50%;
    background: rgba(59,130,246,0.35);
    animation: loc-ripple 2.5s ease-out infinite;
  }
  .location-dot .ripple:nth-child(2) { animation-delay: 0.8s; }
  .location-dot .ripple:nth-child(3) { animation-delay: 1.6s; }
  @keyframes loc-ripple {
    0%   { transform: scale(0.5); opacity: 0.8; }
    100% { transform: scale(5);   opacity: 0; }
  }
  .location-label {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    color: #fff;
    background: #3b82f6;
    padding: 4px 12px;
    border-radius: 12px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    box-shadow: 0 2px 10px rgba(59,130,246,0.4);
    pointer-events: none;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .location-label.arrived {
    background: #22c55e;
    box-shadow: 0 2px 10px rgba(34,197,94,0.5);
  }

  /* Trail line */
  .trail-line {
    position: absolute;
    z-index: 25;
    pointer-events: none;
    stroke: #3b82f6;
    stroke-width: 2.5;
    stroke-dasharray: 8 6;
    fill: none;
    opacity: 0.7;
    stroke-linecap: round;
  }

  /* Arrival particles */
  .particle {
    position: absolute;
    z-index: 28;
    pointer-events: none;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #3b82f6;
    animation: particle-pop 0.7s ease-out forwards;
  }
  @keyframes particle-pop {
    0%   { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* ========== SPOT LIST DRAWER (mobile / optional) ========== */
  .spot-list-trigger {
    position: fixed;
    left: 20px;
    bottom: 118px;
    z-index: 100;
  }
  .spot-list {
    position: fixed;
    left: 20px;
    bottom: 158px;
    width: 220px;
    max-height: 320px;
    overflow-y: auto;
    background: var(--surface-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    z-index: 100;
    padding: 6px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: all 0.25s var(--ease-out);
  }
  .spot-list.open {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  .spot-list .spot-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: all 0.15s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }
  .spot-list .spot-item:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text-primary);
  }
  .spot-list .spot-item:focus-visible {
    outline: 2px solid var(--color-summit);
    outline-offset: -2px;
  }
  .spot-list .dot-mini {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 768px) {
    .topbar {
      top: 8px;
      padding: 6px 10px 6px 14px;
      gap: 4px;
    }
    .topbar .brand { font-size: 13px; }
    .btn { padding: 4px 10px; font-size: 11px; }

    .panel {
      right: 12px; left: 12px;
      width: auto;
      top: auto;
      bottom: 12px;
      transform: translateY(20px);
      max-height: 50dvh;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    .panel.open { transform: translateY(0); }

    .zoom-ctrl { left: 12px; bottom: 16px; }
    .zoom-ctrl button { width: 34px; height: 34px; font-size: 18px; }
    .spot-list { left: 12px; bottom: 140px; width: 180px; }
    .spot-list-trigger { left: 12px; bottom: 100px; }
  }
</style>
</head>
<body>

<!-- ====== TOP BAR ====== -->
<header class="topbar" role="banner">
  <span class="brand">白云山数字导览</span>
  <span class="divider" aria-hidden="true"></span>
  <button class="btn" onclick="resetView()" title="重置视图 (0)">
    重置
  </button>
  <button class="btn" id="btn-all" onclick="toggleAllMarkers()" title="切换标记显示">
    标记
  </button>
  <span class="spot-count">共 13 个景点</span>
</header>

<!-- ====== MAP ====== -->
<main class="map-wrap" id="mapWrap" role="region" aria-label="白云山2.5D地图">
  <div class="map-inner" id="mapInner">
    <img id="scenic-map" src="https://102014.xyz/gs/baiyunshan.png" alt="白云山2.5D全景地图" loading="eager">
    <!-- 艺术字标题 -->
    <img class="title-art" src="bysyshusjtu.png" alt="白云山" draggable="false">
    <!-- 虚拟位置 -->
    <div class="location-dot" id="myLocation">
      <div class="inner"></div>
      <div class="ripple"></div>
      <div class="ripple"></div>
      <div class="ripple"></div>
      <span class="location-label">我的位置</span>
    </div>
  </div>
</main>

<!-- ====== PANEL BACKDROP ====== -->
<div class="panel-backdrop" id="panelBackdrop" onclick="closePanel()" aria-hidden="true"></div>

<!-- ====== INFO PANEL ====== -->
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-label="景点详情"></aside>

<!-- ====== ZOOM ====== -->
<div class="zoom-ctrl">
  <button onclick="zoomIn()" title="放大 (+)" aria-label="放大">+</button>
  <button onclick="zoomOut()" title="缩小 (−)" aria-label="缩小">−</button>
</div>

<!-- ====== SPOT LIST ====== -->
<div class="spot-list-trigger">
  <button class="btn" id="btn-list" onclick="toggleSpotList()" title="景点列表">
    <span class="icon">&#9776;</span> 列表
  </button>
</div>
<div class="spot-list" id="spotList" role="listbox" aria-label="景点列表"></div>


<script>
// ========== SPOT DATA ==========
const CAT = {
  entrance: { name:'入口', cls:'entrance' },
  temple:   { name:'寺庙', cls:'temple' },
  nature:   { name:'自然景观', cls:'nature' },
  summit:   { name:'山顶', cls:'summit' },
  park:     { name:'公园', cls:'park' },
  water:    { name:'水域', cls:'water' },
  view:     { name:'观景台', cls:'view' },
  hiking:   { name:'步道', cls:'hiking' },
};

const spots = [
  { id:1,  x:769,  y:879,  name:"白云山南门",   cat:CAT.entrance, desc:"山脚主要入口，游客中心所在区域。", alt:"" },
  { id:2,  x:493,  y:808,  name:"西门",         cat:CAT.entrance, desc:"西侧入口方向。", alt:"" },
  { id:3,  x:300,  y:747,  name:"梅花园入口",   cat:CAT.entrance, desc:"西侧登山入口，梅花园方向。", alt:"" },
  { id:4,  x:1130, y:876,  name:"东门",         cat:CAT.entrance, desc:"右下入口方向。", alt:"" },
  { id:5,  x:753,  y:539,  name:"能仁寺",       cat:CAT.temple,   desc:"白云山著名古寺，始建于宋代，香火绵延千年。", alt:"海拔约 180m" },
  { id:6,  x:563,  y:517,  name:"桃花涧",       cat:CAT.nature,   desc:"西南山谷溪涧，春日桃花盛开时节美不胜收。", alt:"春季最佳" },
  { id:7,  x:399,  y:337,  name:"白云晚望",     cat:CAT.view,     desc:"西侧观景平台，黄昏时分可远眺广州城全景。", alt:"" },
  { id:8,  x:513,  y:210,  name:"西北山路",     cat:CAT.hiking,   desc:"西北方向山腰步道，林荫夹道，适合徒步。", alt:"" },
  { id:9,  x:737,  y:51,   name:"摩星岭",       cat:CAT.summit,   desc:"白云山最高峰，海拔382米，登顶俯瞰羊城全景。", alt:"382m" },
  { id:10, x:944,  y:121,  name:"明珠楼",       cat:CAT.temple,   desc:"山顶东侧标志性建筑，楼阁依山而建，气势恢宏。", alt:"" },
  { id:11, x:1226, y:428,  name:"黄婆洞水库",   cat:CAT.water,    desc:"白云山内最大水库，碧波荡漾，环湖步道幽静怡人。", alt:"" },
  { id:12, x:811,  y:385,  name:"山顶公园",     cat:CAT.park,     desc:"山顶休闲区，云台花园方向，绿树成荫。", alt:"" },
  { id:13, x:681,  y:354,  name:"山顶核心区",   cat:CAT.temple,   desc:"能仁寺与山顶园林交汇处，白云山文化核心地带。", alt:"" },
];

// ========== STATE ==========
const mapInner  = document.getElementById('mapInner');
const mapWrap   = document.getElementById('mapWrap');
const panel     = document.getElementById('panel');
const backdrop  = document.getElementById('panelBackdrop');
const spotList  = document.getElementById('spotList');

let scale = 0.78, offsetX = 0, offsetY = 0;
let isDragging = false, dragStartX, dragStartY, startOffsetX, startOffsetY;
let activeSpotId = null;
let spotListOpen = false;

const IMG_W = 1358, IMG_H = 1159;

// ========== BUILD MARKERS ==========
spots.forEach(s => {
  const el = document.createElement('div');
  el.className = `marker cat-${s.cat.cls}`;
  el.id = `marker-${s.id}`;
  el.style.left = s.x + 'px';
  el.style.top  = s.y + 'px';
  el.title = s.name;
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', `${s.name} — ${s.cat.name}`);
  el.innerHTML = `
    <div class="pin">
      <div class="head"><span class="num">${s.id}</span></div>
      <div class="pulse-ring" style="border-color: var(--color-${s.cat.cls.replace('cat-','')})"></div>
    </div>
    <span class="label">${s.name}</span>
  `;
  el.addEventListener('click', (e) => { e.stopPropagation(); selectSpot(s.id); });
  mapInner.appendChild(el);
});

// ========== BUILD SPOT LIST ==========
spots.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'spot-item';
  btn.role = 'option';
  btn.innerHTML = `<span class="dot-mini" style="background:var(--color-${s.cat.cls})"></span>${s.name}`;
  btn.addEventListener('click', () => { selectSpot(s.id); closeSpotList(); });
  spotList.appendChild(btn);
});

// ========== VIEW ==========
function applyTransform() {
  mapInner.style.transform = `translate3d(${offsetX}px, ${offsetY}px, 0) scale(${scale})`;
}

function fitToScreen() {
  const w = mapWrap.clientWidth, h = mapWrap.clientHeight;
  scale = Math.min(w / IMG_W, h / IMG_H, 1);
  offsetX = (w - IMG_W * scale) / 2;
  offsetY = (h - IMG_H * scale) / 2;
  applyTransform();
}

function resetView() {
  fitToScreen();
  closePanel();
}

function zoomIn() {
  zoomAt(mapWrap.clientWidth / 2, mapWrap.clientHeight / 2, 1.3);
}
function zoomOut() {
  zoomAt(mapWrap.clientWidth / 2, mapWrap.clientHeight / 2, 1 / 1.3);
}
function zoomAt(cx, cy, factor) {
  const old = scale;
  scale = Math.min(Math.max(scale * factor, 0.2), 4);
  offsetX = cx - (cx - offsetX) * (scale / old);
  offsetY = cy - (cy - offsetY) * (scale / old);
  applyTransform();
}

// ========== DRAG ==========
mapWrap.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.marker')) return;
  isDragging = true;
  mapWrap.classList.add('dragging');
  dragStartX = e.clientX; dragStartY = e.clientY;
  startOffsetX = offsetX; startOffsetY = offsetY;
  mapWrap.setPointerCapture(e.pointerId);
});

mapWrap.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  offsetX = startOffsetX + (e.clientX - dragStartX);
  offsetY = startOffsetY + (e.clientY - dragStartY);
  applyTransform();
});

mapWrap.addEventListener('pointerup', () => {
  isDragging = false;
  mapWrap.classList.remove('dragging');
});

// Wheel zoom
mapWrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = mapWrap.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.1 : 1 / 1.1);
}, { passive: false });

// ========== SPOT SELECTION ==========
function selectSpot(id) {
  if (activeSpotId) {
    document.getElementById(`marker-${activeSpotId}`)?.classList.remove('active');
  }
  document.getElementById(`marker-${id}`)?.classList.add('active');
  activeSpotId = id;
  const s = spots.find(sp => sp.id === id);
  showPanel(s);
  flyToSpot(s.x, s.y);
  simulateArrival(s.x, s.y);
}

function showPanel(s) {
  panel.innerHTML = `
    <div class="panel-header">
      <span class="cat-tag ${s.cat.cls}">${s.cat.name}</span>
      <button class="panel-close" onclick="closePanel()" aria-label="关闭">&times;</button>
      <h3>${s.name}</h3>
    </div>
    <div class="panel-body">
      <p>${s.desc}</p>
      <div class="quick-facts">
        <div class="fact"><span class="fv">#${s.id}</span><span class="fl">编号</span></div>
        <div class="fact"><span class="fv">${s.cat.name}</span><span class="fl">分类</span></div>
        ${s.alt ? `<div class="fact"><span class="fv">${s.alt}</span><span class="fl">海拔</span></div>` : ''}
      </div>
      <div class="panel-nav">
        <button onclick="navigateSpot(-1)">&lsaquo; 上一个</button>
        <button onclick="navigateSpot(1)">下一个 &rsaquo;</button>
      </div>
    </div>
  `;
  panel.classList.add('open');
  backdrop.classList.add('open');
}

function closePanel() {
  panel.classList.remove('open');
  backdrop.classList.remove('open');
  if (activeSpotId) {
    document.getElementById(`marker-${activeSpotId}`)?.classList.remove('active');
    activeSpotId = null;
  }
}

function navigateSpot(dir) {
  if (!activeSpotId) return;
  const idx = spots.findIndex(s => s.id === activeSpotId);
  const next = spots[(idx + dir + spots.length) % spots.length];
  selectSpot(next.id);
}

function flyToSpot(sx, sy) {
  const w = mapWrap.clientWidth, h = mapWrap.clientHeight;
  const targetScale = Math.min(scale * 1.5, 2.2);
  offsetX = w / 2 - sx * targetScale;
  offsetY = h / 2 - sy * targetScale;
  mapInner.style.transition = 'transform 0.55s cubic-bezier(0.16, 1, 0.3, 1)';
  scale = targetScale;
  applyTransform();
  setTimeout(() => { mapInner.style.transition = 'none'; }, 560);
}

// ========== TOGGLES ==========
function toggleAllMarkers() {
  const markers = document.querySelectorAll('.marker');
  const hidden = markers[0]?.style.display === 'none';
  markers.forEach(m => { m.style.display = hidden ? '' : 'none'; });
  document.getElementById('btn-all').classList.toggle('active', hidden);
}

function toggleSpotList() {
  spotListOpen = !spotListOpen;
  spotList.classList.toggle('open', spotListOpen);
}

function closeSpotList() {
  spotListOpen = false;
  spotList.classList.remove('open');
}

// Close spot list on click outside
document.addEventListener('click', (e) => {
  if (spotListOpen && !e.target.closest('#spotList') && !e.target.closest('#btn-list')) {
    closeSpotList();
  }
});

// ========== KEYBOARD ==========
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closePanel(); closeSpotList(); }
  if (['+','='].includes(e.key) && !e.target.closest('input,textarea')) zoomIn();
  if (e.key === '-' && !e.target.closest('input,textarea')) zoomOut();
  if (e.key === '0' && !e.target.closest('input,textarea')) resetView();
  if (['ArrowLeft','ArrowRight'].includes(e.key) && activeSpotId) {
    navigateSpot(e.key === 'ArrowRight' ? 1 : -1);
  }
});

// ========== VIRTUAL LOCATION ==========
const myLoc = document.getElementById('myLocation');
let myLocX = 769, myLocY = 879; // 默认南门附近

function updateMyLoc() {
  myLoc.style.left = myLocX + 'px';
  myLoc.style.top  = myLocY + 'px';
}
updateMyLoc();

// 画轨迹线
function drawTrail(x1, y1, x2, y2) {
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.classList.add('trail-line');
  svg.style.left = '0';
  svg.style.top  = '0';
  svg.style.width = '100%';
  svg.style.height = '100%';
  svg.style.position = 'absolute';
  const line = document.createElementNS(svgNS, 'line');
  line.setAttribute('x1', x1);
  line.setAttribute('y1', y1);
  line.setAttribute('x2', x2);
  line.setAttribute('y2', y2);
  line.setAttribute('stroke', '#3b82f6');
  line.setAttribute('stroke-width', '2.5');
  line.setAttribute('stroke-dasharray', '8 6');
  line.setAttribute('fill', 'none');
  line.setAttribute('opacity', '0.7');
  svg.appendChild(line);
  mapInner.appendChild(svg);
  // 渐隐
  setTimeout(() => { svg.style.transition = 'opacity 1s'; svg.style.opacity = '0'; }, 600);
  setTimeout(() => { svg.remove(); }, 1600);
}

// 到达粒子
function spawnParticles(x, y, count = 10) {
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = Math.random() * Math.PI * 2;
    const dist = 20 + Math.random() * 30;
    p.style.left = x + 'px';
    p.style.top  = y + 'px';
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    p.style.background = i % 3 === 0 ? '#22c55e' : '#3b82f6';
    mapInner.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }
}

// 点击景点后，模拟"走到"该位置
function simulateArrival(sx, sy) {
  const fromX = myLocX, fromY = myLocY;
  drawTrail(fromX, fromY, sx, sy);
  setTimeout(() => {
    myLocX = sx;
    myLocY = sy;
    const label = myLoc.querySelector('.location-label');
    label.textContent = '已到达';
    label.classList.add('arrived');
    updateMyLoc();
    spawnParticles(sx, sy);
    setTimeout(() => {
      label.textContent = '我的位置';
      label.classList.remove('arrived');
    }, 2000);
  }, 200);
}

// ========== INIT ==========
fitToScreen();
window.addEventListener('resize', fitToScreen);
mapWrap.addEventListener('dblclick', (e) => {
  if (!e.target.closest('.marker')) resetView();
});
</script>
